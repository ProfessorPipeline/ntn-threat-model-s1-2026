  <text class="asset" x="415" y="445">A1 · A3 · A4 · A5</text>
  <rect class="node" x="665" y="380" width="200" height="90" fill="#d0e7d7"/>
  <text class="node-title" x="765" y="418">C4 · Ground gNB</text>
  <text class="asset" x="765" y="445">A1 · A2 · A3 · A4 · A5</text>
  <rect class="node" x="965" y="380" width="170" height="90" fill="#e9dcef"/>
  <text class="node-title" x="1050" y="408">C5 · 5G Core</text>
  <text class="node-title" x="1050" y="428">interfaces</text>
  <text class="asset" x="1050" y="451">A1 · A2 · A3</text>
  <text x="31" y="574" font-size="11" fill="#6c8591">Solid arrows: access and transport · Dashed admin path: second F5 destination · Red dashed lines: trust boundaries</text>
  <text x="31" y="595" font-size="10" fill="#8b9da7">Topology and asset placements follow Figure A in the supplied progress update. Verify before academic submission.</text>
</svg>
