  <text class="flow-label" x="775" y="311">F5 Admin</text>
  <text class="flow-label" x="577" y="252">F5 to C3</text>
  <rect class="node" x="50" y="130" width="175" height="85" fill="#dceaf3"/>
  <text class="node-title" x="137" y="165">C1 · Rural UE</text>
  <text class="asset" x="137" y="190">A1 · A2 · A3</text>
  <rect class="node" x="315" y="130" width="190" height="85" fill="#f9e5ba"/>
  <text class="node-title" x="410" y="157">C2 · Transparent</text>
  <text class="node-title" x="410" y="177">LEO relay</text>
  <text class="asset" x="410" y="198">A1 · A3</text>
  <rect class="node" x="670" y="130" width="210" height="85" fill="#e4ddcf"/>
