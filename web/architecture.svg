<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="610" viewBox="0 0 1180 610" role="img" aria-labelledby="title desc">
  <title id="title">S1 transparent LEO NTN reference architecture</title>
  <desc id="desc">Six components connected by five flow groups. Four trust boundaries divide the domains. The transparent satellite relays signals to a ground gNB through a gateway. Administration manages both ground components.</desc>
  <defs>
    <marker id="arrow" markerWidth="7" markerHeight="7" refX="5" refY="3.5" orient="auto-start-reverse"><path d="M0 0L7 3.5L0 7" fill="none" stroke="#4d6878" stroke-width="1.2"/></marker>
    <style>text{font-family:Arial,sans-serif;fill:#294351}.domain{stroke:#d7e1e6;stroke-dasharray:4 4}.domain-name{font-size:12px;fill:#7e929c;letter-spacing:.5px}.node{stroke:#6c8b97;stroke-width:1.5;rx:9}.node-title{font-size:15px;font-weight:700;text-anchor:middle}.asset{font-size:11px;fill:#5b7784;text-anchor:middle}.flow{stroke:#4d6878;stroke-width:1.8;fill:none;marker-start:url(#arrow);marker-end:url(#arrow)}.boundary{stroke:#c76c55;stroke-width:2;stroke-dasharray:7 5}.boundary-label{font-size:12px;fill:#b85843;font-weight:700}.label-box{fill:white;stroke:#d6e1e5;rx:4}.flow-label{font-size:11px;text-anchor:middle;fill:#53707d}</style>
  </defs>
  <rect width="1180" height="610" fill="#fff"/>
  <text x="30" y="34" font-size="12" fill="#637d8b">REFERENCE SCENARIO S1 · STATIC SERVICE SNAPSHOT</text>
  <rect class="domain" x="28" y="65" width="225" height="180" fill="#f1f6fa"/>
  <text class="domain-name" x="44" y="88">USER DOMAIN</text>
  <rect class="domain" x="282" y="65" width="260" height="180" fill="#fff7e8"/>
  <text class="domain-name" x="298" y="88">SPACE RELAY DOMAIN</text>
  <rect class="domain" x="650" y="65" width="250" height="180" fill="#f4f1eb"/>
  <text class="domain-name" x="666" y="88">PRIVILEGED ADMINISTRATION</text>
  <rect class="domain" x="282" y="310" width="618" height="220" fill="#edf6f0"/>
  <text class="domain-name" x="298" y="335">GROUND ACCESS DOMAIN</text>
  <rect class="domain" x="940" y="310" width="212" height="220" fill="#f5eff7"/>
  <text class="domain-name" x="955" y="335">OPERATOR CORE DOMAIN</text>
  <path class="boundary" d="M267 65V245"/>
  <text class="boundary-label" x="255" y="57">TB1</text>
  <path class="boundary" d="M282 276H542"/>
  <text class="boundary-label" x="549" y="280">TB2</text>
  <path class="boundary" d="M920 310V530"/>
  <text class="boundary-label" x="906" y="552">TB3</text>
  <path class="boundary" d="M582 276H900"/>
  <text class="boundary-label" x="907" y="280">TB4</text>
  <path class="flow" d="M225 172H315"/>
  <rect class="label-box" x="227" y="116" width="87" height="25"/>
  <text class="flow-label" x="270" y="133">F1 Service radio</text>
  <path class="flow" d="M410 215V380"/>
  <rect class="label-box" x="361" y="295" width="99" height="25"/>
  <text class="flow-label" x="410" y="312">F2 Feeder radio</text>
  <path class="flow" d="M515 425H665"/>
  <rect class="label-box" x="531" y="383" width="119" height="25"/>
  <text class="flow-label" x="590" y="400">F3 Ground transport</text>
